name: Build Standalone VS Code Android APK (Zero Termux)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-arm64-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Project Source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Auto-Fix Folder Structure & Generate Root Configs
        run: |
          for f in app__*; do
            if [ -f "$f" ]; then
              target=$(echo "$f" | sed 's/__/\//g')
              mkdir -p "$(dirname "$target")"
              mv "$f" "$target"
            fi
          done

          cat > settings.gradle.kts << 'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "VSCodeAndroidStandalone"
          include(":app")
          EOF

          cat > build.gradle.kts << 'EOF'
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          EOF

          cat > gradle.properties << 'EOF'
          org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          kotlin.code.style=official
          android.nonTransitiveRClass=true
          EOF

          LIVE_DEBIAN_URL=$(curl -sL https://raw.githubusercontent.com/termux/proot-distro/master/distro-plugins/debian.sh | grep "TARBALL_URL\['aarch64'\]" | grep -o 'https://[^'\''"]*' | head -n 1)
          if [ -z "$LIVE_DEBIAN_URL" ]; then
            LIVE_DEBIAN_URL="https://github.com/termux/proot-distro/releases/download/v4.19.0/debian-bookworm-aarch64-pd-v4.19.0.tar.xz"
          fi

          STANDALONE_PROV="app/src/main/java/com/vscode/desktop/standalone/StandaloneProvisioner.kt"
          mkdir -p "$(dirname "$STANDALONE_PROV")"
          cat > "$STANDALONE_PROV" << 'EOF'
          package com.vscode.desktop.standalone

          import android.content.Context
          import org.apache.commons.compress.archivers.tar.TarArchiveInputStream
          import org.apache.commons.compress.compressors.gzip.GzipCompressorInputStream
          import org.apache.commons.compress.compressors.xz.XZCompressorInputStream
          import java.io.*
          import java.net.HttpURLConnection
          import java.net.URL
          import java.nio.file.Files
          import java.nio.file.Paths

          class StandaloneProvisioner(private val context: Context, private val prootManager: ProotProcessManager) {
              companion object {
                  val DEBIAN_ROOTFS_URLS = listOf(
                      "@LIVE_DEBIAN_URL@",
                      "https://github.com/termux/proot-distro/releases/download/v4.19.0/debian-bookworm-aarch64-pd-v4.19.0.tar.xz"
                  )
                  const val VSCODE_ARM64_URL = "https://update.code.visualstudio.com/latest/linux-arm64/stable"
              }

              fun provisionAll(onProgress: (String) -> Unit): Boolean {
                  return try {
                      exportAssetScripts()
                      val rootfsTar = File(prootManager.tmpDir, "debian-arm64-rootfs.tar")
                      if (!File(prootManager.rootfsDir, "bin/bash").exists()) {
                          onProgress("1/4 Downloading ARM64 Debian Rootfs...")
                          downloadWithFallbacks(DEBIAN_ROOTFS_URLS, rootfsTar, onProgress)
                          onProgress("2/4 Extracting Debian Rootfs...")
                          extractTarArchive(rootfsTar, prootManager.rootfsDir)
                          rootfsTar.delete()
                      }
                      val vscodeDir = File(prootManager.rootfsDir, "opt/vscode-arm64")
                      if (!File(vscodeDir, "bin/code").exists()) {
                          vscodeDir.mkdirs()
                          val vscodeTar = File(prootManager.tmpDir, "vscode-linux-arm64.tar.gz")
                          onProgress("3/4 Downloading Official Microsoft VS Code...")
                          downloadFile(VSCODE_ARM64_URL, vscodeTar, onProgress)
                          onProgress("4/4 Extracting Genuine VS Code...")
                          extractTarArchive(vscodeTar, vscodeDir)
                          vscodeTar.delete()
                      }
                      onProgress("Configuring Environment...")
                      val p = prootManager.startProotCommand("bash /root/init-rootfs.sh", prootManager.homeDir.absolutePath, onLogLine = onProgress)
                      val exit = p.waitFor()
                      onProgress("Provisioning finished with code $exit")
                      exit == 0
                  } catch (e: Exception) {
                      onProgress("ERROR during provisioning: ${e.message}")
                      false
                  }
              }

              private fun exportAssetScripts() {
                  val targetDir = File(prootManager.rootfsDir, "root").apply { mkdirs() }
                  listOf("init-rootfs.sh", "start-vscode-session.sh", "verify-vscode.sh").forEach { name ->
                      val outFile = File(targetDir, name)
                      context.assets.open(name).use { input -> FileOutputStream(outFile).use { output -> input.copyTo(output) } }
                      outFile.setExecutable(true, false)
                  }
              }

              private fun downloadWithFallbacks(urls: List<String>, destination: File, onProgress: (String) -> Unit) {
                  var lastEx: Exception? = null
                  for (candidate in urls) {
                      if (candidate.isBlank() || candidate.startsWith("@")) continue
                      try {
                          downloadFile(candidate, destination, onProgress)
                          return
                      } catch (e: Exception) {
                          lastEx = e
                          destination.delete()
                      }
                  }
                  throw (lastEx ?: IOException("All mirrors failed"))
              }

              private fun downloadFile(urlStr: String, destination: File, onProgress: (String) -> Unit) {
                  var currentUrl = urlStr
                  var redirects = 0
                  while (redirects < 10) {
                      val conn = URL(currentUrl).openConnection() as HttpURLConnection
                      conn.instanceFollowRedirects = false
                      conn.setRequestProperty("User-Agent", "Mozilla/5.0")
                      conn.connectTimeout = 30000
                      conn.readTimeout = 30000
                      val code = conn.responseCode
                      if (code in listOf(301, 302, 303, 307, 308)) {
                          val loc = conn.getHeaderField("Location")
                          if (loc != null) {
                              currentUrl = if (loc.startsWith("http")) loc else URL(URL(currentUrl), loc).toString()
                              redirects++
                              continue
                          }
                      }
                      if (code != 200) throw IOException("HTTP $code on $currentUrl")
                      val totalBytes = conn.contentLengthLong
                      BufferedInputStream(conn.inputStream).use { input ->
                          FileOutputStream(destination).use { output ->
                              val buffer = ByteArray(64 * 1024)
                              var downloaded = 0L
                              var read: Int
                              var lastMb = -1L
                              while (input.read(buffer).also { read = it } != -1) {
                                  output.write(buffer, 0, read)
                                  downloaded += read
                                  val mb = downloaded / (1024 * 1024)
                                  if (mb != lastMb && mb % 5L == 0L) {
                                      lastMb = mb
                                      val totalMb = if (totalBytes > 0) "${totalBytes / (1024 * 1024)} MB" else "..."
                                      onProgress("Downloaded $mb MB / $totalMb...")
                                  }
                              }
                          }
                      }
                      return
                  }
              }

              private fun extractTarArchive(archiveFile: File, destDir: File) {
                  val isXz = archiveFile.name.endsWith(".xz") || archiveFile.name.contains("pd-")
                  FileInputStream(archiveFile).use { fis ->
                      val compStream = if (isXz) XZCompressorInputStream(BufferedInputStream(fis)) else GzipCompressorInputStream(BufferedInputStream(fis))
                      TarArchiveInputStream(compStream).use { tar ->
                          val standardDirs = setOf("bin", "sbin", "etc", "usr", "lib", "var", "dev", "proc", "sys", "root", "home", "tmp", "opt")
                          var entry = tar.nextTarEntry
                          while (entry != null) {
                              val cleanName = entry.name.trimStart('.', '/')
                              if (cleanName.isNotEmpty()) {
                                  val parts = cleanName.split("/").filter { it.isNotEmpty() }
                                  val finalRelPath = if (parts.size > 1 && !standardDirs.contains(parts[0])) parts.drop(1).joinToString("/") else parts.joinToString("/")
                                  if (finalRelPath.isNotEmpty()) {
                                      val outFile = File(destDir, finalRelPath)
                                      if (entry.isDirectory) {
                                          outFile.mkdirs()
                                      } else if (entry.isSymbolicLink) {
                                          outFile.parentFile?.mkdirs()
                                          outFile.delete()
                                          try { Files.createSymbolicLink(outFile.toPath(), Paths.get(entry.linkName)) } catch (_: Exception) {}
                                      } else {
                                          outFile.parentFile?.mkdirs()
                                          FileOutputStream(outFile).use { out -> tar.copyTo(out) }
                                          if ((entry.mode and 0b001_000_000) != 0) outFile.setExecutable(true, false)
                                      }
                                  }
                              }
                              entry = tar.nextTarEntry
                          }
                      }
                  }
              }
          }
          EOF

          python3 -c "
          path = '$STANDALONE_PROV'
          url = '$LIVE_DEBIAN_URL'
          with open(path, 'r') as f:
              c = f.read()
          c = c.replace('@LIVE_DEBIAN_URL@', url)
          with open(path, 'w') as f:
              f.write(c)
          "

      - name: Fetch and Patch ARM64 Binaries with patchelf
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y patchelf

          mkdir -p app/src/main/jniLibs/arm64-v8a
          mkdir -p /tmp/proot-extract
          cd /tmp/proot-extract

          PACKAGES_URL="https://packages.termux.dev/apt/termux-main/dists/stable/main/binary-aarch64/Packages"
          curl -sL "$PACKAGES_URL" -o Packages

          PROOT_DEB_PATH=$(awk '/^Package: proot$/,/^$/' Packages | grep '^Filename:' | awk '{print $2}')
          TALLOC_DEB_PATH=$(awk '/^Package: libtalloc$/,/^$/' Packages | grep '^Filename:' | awk '{print $2}')

          curl -sL "https://packages.termux.dev/apt/termux-main/$PROOT_DEB_PATH" -o proot.deb
          curl -sL "https://packages.termux.dev/apt/termux-main/$TALLOC_DEB_PATH" -o talloc.deb

          ar x proot.deb data.tar.xz && tar -xf data.tar.xz
          ar x talloc.deb data.tar.xz && tar -xf data.tar.xz

          DEST="$GITHUB_WORKSPACE/app/src/main/jniLibs/arm64-v8a"

          # 1. Patch libtalloc so it has soname libtalloc.so and strict .so filename
          cp data/data/com.termux/files/usr/lib/libtalloc.so.2 "$DEST/libtalloc.so"
          patchelf --set-soname libtalloc.so "$DEST/libtalloc.so"

          # 2. Patch libproot so it looks for libtalloc.so in its own directory ($ORIGIN)
          cp data/data/com.termux/files/usr/bin/proot "$DEST/libproot.so"
          patchelf --replace-needed libtalloc.so.2 libtalloc.so "$DEST/libproot.so"
          patchelf --set-rpath '$ORIGIN' "$DEST/libproot.so"

          # 3. Copy loader
          cp data/data/com.termux/files/usr/libexec/proot/loader "$DEST/libproot-loader.so"

          chmod 755 "$DEST/"*.so*

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Assemble Standalone APK
        run: |
          gradle wrapper --gradle-version 8.7
          ./gradlew assembleDebug --stacktrace

      - name: Upload Installable Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: VSCode-Android-Standalone-arm64-v8a-APK
          path: app/build/outputs/apk/debug/app-debug.apk
