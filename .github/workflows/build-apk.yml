name: Build Standalone VS Code APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-arm64-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Project Source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Restore Folder Structure and Root Configs
        run: |
          for f in app__*; do
            if [ -f "$f" ]; then
              target=$(echo "$f" | sed 's/__/\//g')
              mkdir -p "$(dirname "$target")"
              mv "$f" "$target"
            fi
          done

          cat > settings.gradle.kts << 'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "VSCodeAndroidStandalone"
          include(":app")
          EOF

          cat > build.gradle.kts << 'EOF'
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          EOF

          cat > gradle.properties << 'EOF'
          org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          kotlin.code.style=official
          android.nonTransitiveRClass=true
          EOF

      - name: Restore or Generate Permanent Signing Keystore
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p ~/.android app /tmp/keystore_dl
          RESTORED=false

          if [ -f "app/keystore.jks" ]; then
            cp app/keystore.jks ~/.android/debug.keystore
            RESTORED=true
          fi

          if [ "$RESTORED" = "false" ]; then
            if gh release download --pattern "pocket-vscode-permanent.keystore" --dir /tmp/keystore_dl 2>/dev/null; then
              if [ -f "/tmp/keystore_dl/pocket-vscode-permanent.keystore" ]; then
                cp /tmp/keystore_dl/pocket-vscode-permanent.keystore ~/.android/debug.keystore
                cp /tmp/keystore_dl/pocket-vscode-permanent.keystore app/keystore.jks
                RESTORED=true
              fi
            fi
          fi

          if [ "$RESTORED" = "false" ]; then
            keytool -genkeypair -v \
              -keystore ~/.android/debug.keystore \
              -alias androiddebugkey \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass android \
              -keypass android \
              -dname "CN=PocketVSCode, OU=Dev, O=Standalone, L=Bijnor, ST=UP, C=IN"
            cp ~/.android/debug.keystore app/keystore.jks
          fi

          cp ~/.android/debug.keystore pocket-vscode-permanent.keystore

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f app/keystore.jks || true
          git commit -m "chore: save permanent keystore" || true
          git push origin HEAD:${{ github.ref_name }} || true

          find app -name "build.gradle.kts" -exec sed -i 's/versionCode = [0-9]*/versionCode = ${{ github.run_number }}/g' {} + || true
          find app -name "build.gradle" -exec sed -i 's/versionCode [0-9]*/versionCode ${{ github.run_number }}/g' {} + || true

      - name: Set App Name and Generate Official VS Code Icons
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y python3-pil curl

          mkdir -p app/src/main/res/values
          cat > app/src/main/res/values/strings.xml << 'EOF'
          <resources>
              <string name="app_name">Pocket VS Code</string>
              <color name="ic_launcher_background">#1E1E1E</color>
          </resources>
          EOF

          rm -rf app/src/main/res/mipmap-anydpi*
          rm -rf app/src/main/res/drawable*/ic_launcher*

          curl -sL "https://raw.githubusercontent.com/microsoft/vscode/main/resources/linux/code.png" -o vscode_icon.png

          python3 - << 'EOF'
          import os, re
          from PIL import Image

          img = Image.open("vscode_icon.png").convert("RGBA")

          v26_dir = "app/src/main/res/mipmap-anydpi-v26"
          os.makedirs(v26_dir, exist_ok=True)
          adaptive_xml = '''<?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@color/ic_launcher_background" />
              <foreground android:drawable="@mipmap/ic_launcher_foreground" />
          </adaptive-icon>
          '''
          with open(os.path.join(v26_dir, "ic_launcher.xml"), "w") as f:
              f.write(adaptive_xml)
          with open(os.path.join(v26_dir, "ic_launcher_round.xml"), "w") as f:
              f.write(adaptive_xml)

          densities = {
              "mipmap-mdpi": (48, 108),
              "mipmap-hdpi": (72, 162),
              "mipmap-xhdpi": (96, 216),
              "mipmap-xxhdpi": (144, 324),
              "mipmap-xxxhdpi": (192, 432)
          }

          for folder, (legacy_size, adaptive_size) in densities.items():
              dest_dir = os.path.join("app/src/main/res", folder)
              os.makedirs(dest_dir, exist_ok=True)

              legacy_icon = img.resize((legacy_size, legacy_size), Image.Resampling.LANCZOS)
              legacy_icon.save(os.path.join(dest_dir, "ic_launcher.png"))
              legacy_icon.save(os.path.join(dest_dir, "ic_launcher_round.png"))

              fg = Image.new("RGBA", (adaptive_size, adaptive_size), (0, 0, 0, 0))
              inner_size = int(adaptive_size * 0.66)
              inner_img = img.resize((inner_size, inner_size), Image.Resampling.LANCZOS)
              offset = (adaptive_size - inner_size) // 2
              fg.paste(inner_img, (offset, offset), inner_img)
              fg.save(os.path.join(dest_dir, "ic_launcher_foreground.png"))

          for root, _, files in os.walk("app/src/main"):
              for file in files:
                  if file == "AndroidManifest.xml":
                      mpath = os.path.join(root, file)
                      with open(mpath, "r", encoding="utf-8") as f:
                          c = f.read()
                      if 'android:icon=' in c:
                          c = re.sub(r'android:icon="[^"]*"', 'android:icon="@mipmap/ic_launcher"', c)
                      else:
                          c = re.sub(r'<application', '<application android:icon="@mipmap/ic_launcher"', c, count=1)
                      if 'android:roundIcon=' in c:
                          c = re.sub(r'android:roundIcon="[^"]*"', 'android:roundIcon="@mipmap/ic_launcher_round"', c)
                      else:
                          c = re.sub(r'<application', '<application android:roundIcon="@mipmap/ic_launcher_round"', c, count=1)
                      c = re.sub(r'android:label="[^"]*"', 'android:label="@string/app_name"', c)
                      with open(mpath, "w", encoding="utf-8") as f:
                          f.write(c)
          EOF

      - name: Pre-Bundle Debian Rootfs and Official VS Code
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p app/src/main/assets
          python3 - << 'EOF'
          import urllib.request, json, subprocess, os, sys
          urls = []
          try:
              res = subprocess.run(["gh", "api", "repos/termux/proot-distro/releases?per_page=100"], capture_output=True, text=True)
              for rel in json.loads(res.stdout):
                  for asset in rel.get("assets", []):
                      n = asset.get("name", "")
                      if "debian" in n and "aarch64" in n and ("tar.xz" in n or "tar.gz" in n):
                          urls.append(asset.get("browser_download_url"))
          except Exception:
              pass
          urls.append("https://raw.githubusercontent.com/debuerreotype/docker-debian-artifacts/dist-arm64v8/bookworm/rootfs.tar.xz")
          urls.append("http://cdimage.ubuntu.com/ubuntu-base/releases/22.04/release/ubuntu-base-22.04-base-arm64.tar.gz")
          ok = False
          for u in urls:
              try:
                  req = urllib.request.Request(u, headers={"User-Agent": "Mozilla/5.0"})
                  with urllib.request.urlopen(req, timeout=60) as r:
                      ext = ".xz" if "xz" in u else ".gz"
                      dest = f"app/src/main/assets/debian-rootfs.tar{ext}"
                      with open(dest, "wb") as f:
                          while True:
                              c = r.read(1024 * 1024)
                              if not c: break
                              f.write(c)
                      if os.path.getsize(dest) > 10 * 1024 * 1024:
                          ok = True
                          break
              except Exception:
                  pass
          if not ok:
              sys.exit(1)
          EOF
          curl -fSL -H "User-Agent: Mozilla/5.0" "https://update.code.visualstudio.com/latest/linux-arm64/stable" -o app/src/main/assets/vscode-linux-arm64.tar.gz

      - name: Add Auto-Save, Session Persistence, & Battery Optimization
        run: |
          python3 - << 'EOF'
          import os, re

          script_path = "app/src/main/assets/start-vscode-session.sh"
          with open(script_path, "r", encoding="utf-8") as f:
              orig = f.read()

          orig = orig.replace("--I-KNOW-THIS-IS-INSECURE", "")
          orig = re.sub(r'1280x720|1280x800|1024x768', '1920x1080', orig)
          orig = re.sub(r'--extensions-dir\s+\S+\s*(\\?\n)?', '', orig)
          orig = re.sub(r'(serve-web[\s\S]*?)--user-data-dir', r'\1--server-data-dir', orig)

          if "/opt/vscode-arm64/code" in orig and "--disable-gpu" not in orig:
              orig = orig.replace("/opt/vscode-arm64/code", "/opt/vscode-arm64/code --no-sandbox --disable-gpu --disable-dev-shm-usage --disable-software-rasterizer")

          orig = orig.replace("/opt/vscode-arm64/bin/code serve-web", "/usr/local/bin/code-serve-web-smart")

          header_patch = """#!/bin/bash
          mkdir -p /tmp /dev/shm /root/.config/Code/User /root/.vscode-server-data/data/Machine /root/.vscode-server-data/data/User /root/Workspace /usr/local/bin
          chmod 1777 /tmp /dev/shm || true

          if [ ! -f /usr/local/bin/sudo ]; then
              printf '#!/bin/sh\\nexec "$@"\\n' > /usr/local/bin/sudo
              chmod 755 /usr/local/bin/sudo
          fi

          if [ -f /opt/vscode-arm64/bin/code ]; then
              sed -i 's|/proc/version|/dev/null|g' /opt/vscode-arm64/bin/code || true
          fi

          # 1. Configure Auto-Save (500ms), Hot-Exit Session Restore, and Battery-Saving Watcher Exclusions
          for S_PATH in "/root/.config/Code/User/settings.json" "/root/.vscode-server-data/data/Machine/settings.json" "/root/.vscode-server-data/data/User/settings.json"; do
              if [ ! -f "$S_PATH" ]; then
                  cat > "$S_PATH" << 'JSONEOF'
          {
              "files.autoSave": "afterDelay",
              "files.autoSaveDelay": 500,
              "files.hotExit": "onExitAndWindowClose",
              "window.restoreWindows": "all",
              "workbench.startupEditor": "none",
              "telemetry.telemetryLevel": "off",
              "extensions.autoCheckUpdates": false,
              "extensions.autoUpdate": false,
              "update.mode": "none",
              "files.watcherExclude": {
                  "**/.git/objects/**": true,
                  "**/.git/subtree-cache/**": true,
                  "**/node_modules/*/**": true,
                  "**/.hg/store/**": true,
                  "**/build/**": true,
                  "**/.gradle/**": true
              }
          }
          JSONEOF
              fi
          done

          # 2. Smart Mode 2 Wrapper with Battery-Saving Idle Auto-Hibernation (stops after 10 mins of no browser connection)
          cat > /usr/local/bin/code-serve-web-smart << 'WRAPEOF'
          #!/bin/bash
          start_idle_watcher() {
              (
                  IDLE_SECONDS=0
                  while pgrep -f "serve-web" >/dev/null 2>&1; do
                      sleep 30
                      # Check /proc/net/tcp for ESTABLished (01) connections on port 8080 (hex 1F90)
                      if grep -q ":1F90 .* 01 " /proc/net/tcp /proc/net/tcp6 2>/dev/null; then
                          IDLE_SECONDS=0
                      else
                          IDLE_SECONDS=$((IDLE_SECONDS + 30))
                      fi
                      # Hibernate server after 600s (10 mins) of closed website to save 100% background battery
                      if [ "$IDLE_SECONDS" -ge 600 ]; then
                          echo "[battery-saver] Mode 2 website closed for 10 mins. Auto-saving and hibernating server..."
                          pkill -15 -f "serve-web" || true
                          exit 0
                      fi
                  done
              ) &
          }

          if pgrep -f "code-tunnel.*serve-web" >/dev/null 2>&1 || pgrep -f "opt/vscode-arm64.*serve-web" >/dev/null 2>&1; then
              echo "[start-vscode] Resuming active Mode 2 session on port 8080..."
              echo "Web UI available at http://127.0.0.1:8080/?folder=/root/Workspace"
              while pgrep -f "serve-web" >/dev/null 2>&1; do
                  sleep 3
              done
              exit 0
          fi

          start_idle_watcher
          exec nice -n 5 /opt/vscode-arm64/bin/code serve-web \\
              --host 127.0.0.1 \\
              --port 8080 \\
              --without-connection-token \\
              --accept-server-license-terms \\
              --server-data-dir /root/.vscode-server-data
          WRAPEOF
          chmod 755 /usr/local/bin/code-serve-web-smart

          if [ ! -f /opt/vscode-arm64/.noroot_patched ] && [ -d /opt/vscode-arm64/resources/app/out ]; then
              find /opt/vscode-arm64/resources/app/out -name "preload*.js" -exec sed -i 's/process\.getuid()/1000/g' {} + || true
              WB_JS="/opt/vscode-arm64/resources/app/out/vs/workbench/workbench.desktop.main.js"
              if [ -f "$WB_JS" ]; then
                  sed -i 's/\.getuid\?\.()===0/false/g; s/\.getuid()===0/false/g; s/ \[Superuser\]//g; s/\[Superuser\]//g' "$WB_JS" || true
              fi
              touch /opt/vscode-arm64/.noroot_patched
          fi

          if [ "$1" != "direct" ]; then
              pkill -9 -f Xtigervnc || true
              pkill -9 -f websockify || true
              pkill -9 -f openbox || true
              rm -rf /tmp/.X1-lock /tmp/.X11-unix/X1 /tmp/.X*-lock /tmp/.X11-unix/X*
              sleep 1
          fi
          """

          if orig.startswith("#!/"):
              orig = re.sub(r'^#!/[^\n]*\n', header_patch + "\n", orig, count=1)
          else:
              orig = header_patch + "\n" + orig

          with open(script_path, "w", encoding="utf-8") as f:
              f.write(orig)
          os.chmod(script_path, 0o755)

          for root, _, files in os.walk("app/src/main/java"):
              for fn in files:
                  p = os.path.join(root, fn)
                  if fn == "ProotProcessManager.kt":
                      with open(p, "r", encoding="utf-8") as f:
                          code = f.read()
                      sync_snippet = """
                      try {
                          val rDir = File(rootfsDir, "root").apply { mkdirs() }
                          listOf("init-rootfs.sh", "start-vscode-session.sh", "verify-vscode.sh").forEach { name ->
                              val out = File(rDir, name)
                              context.assets.open(name).use { inp -> java.io.FileOutputStream(out).use { o -> inp.copyTo(o) } }
                              out.setExecutable(true, false)
                          }
                      } catch (_: Exception) {}
                      """
                      if "start-vscode-session.sh" not in code:
                          code = re.sub(
                              r'(fun\s+startProotCommand\s*\([^)]*\)\s*:\s*Process\s*\{)',
                              r'\1\n' + sync_snippet,
                              code,
                              count=1
                          )
                          with open(p, "w", encoding="utf-8") as f:
                              f.write(code)

                  if fn.endswith(".kt"):
                      with open(p, "r", encoding="utf-8") as f:
                          code = f.read()

                      code = code.replace('"http://127.0.0.1:8080"', '"http://127.0.0.1:8080/?folder=/root/Workspace"')
                      code = code.replace('"http://127.0.0.1:8080/"', '"http://127.0.0.1:8080/?folder=/root/Workspace"')

                      if ".loadUrl(" in code and "shouldOverrideUrlLoading" not in code:
                          wv_chain = """.apply {
                              settings.javaScriptEnabled = true
                              settings.domStorageEnabled = true
                              settings.databaseEnabled = true
                              webViewClient = object : android.webkit.WebViewClient() {
                                  override fun shouldOverrideUrlLoading(view: android.webkit.WebView?, request: android.webkit.WebResourceRequest?): Boolean = false
                                  @Deprecated("Deprecated in Java")
                                  override fun shouldOverrideUrlLoading(view: android.webkit.WebView?, url: String?): Boolean = false
                                  override fun onReceivedError(view: android.webkit.WebView?, request: android.webkit.WebResourceRequest?, error: android.webkit.WebResourceError?) {
                                      if (request?.isForMainFrame == true) {
                                          view?.postDelayed({ view.reload() }, 1000)
                                      }
                                  }
                              }
                          }.loadUrl("""
                          code = code.replace(".loadUrl(", wv_chain)

                      # Add WebView lifecycle battery saver + auto-blur flush when user leaves WorkbenchActivity
                      if fn == "WorkbenchActivity.kt" and "override fun onPause()" not in code:
                          lifecycle_patch = """
                          override fun onPause() {
                              try {
                                  webView.evaluateJavascript("window.dispatchEvent(new Event('blur')); document.dispatchEvent(new Event('visibilitychange'));", null)
                                  webView.onPause()
                              } catch (_: Exception) {}
                              super.onPause()
                          }

                          override fun onResume() {
                              super.onResume()
                              try {
                                  webView.onResume()
                              } catch (_: Exception) {}
                          }
                          """
                          code = re.sub(r'(\}\s*)$', lifecycle_patch + "\n}", code, count=1)

                      with open(p, "w", encoding="utf-8") as f:
                          f.write(code)
          EOF

      - name: Configure Universal Asset Unpacker
        run: |
          STANDALONE_PROV="app/src/main/java/com/vscode/desktop/standalone/StandaloneProvisioner.kt"
          mkdir -p "$(dirname "$STANDALONE_PROV")"
          cat > "$STANDALONE_PROV" << 'EOF'
          package com.vscode.desktop.standalone

          import android.content.Context
          import org.apache.commons.compress.archivers.tar.TarArchiveInputStream
          import org.apache.commons.compress.compressors.gzip.GzipCompressorInputStream
          import org.apache.commons.compress.compressors.xz.XZCompressorInputStream
          import java.io.*
          import java.nio.file.Files
          import java.nio.file.Paths

          class StandaloneProvisioner(private val context: Context, private val prootManager: ProotProcessManager) {

              fun provisionAll(onProgress: (String) -> Unit): Boolean {
                  return try {
                      exportAssetScripts()
                      if (!File(prootManager.rootfsDir, "bin/bash").exists()) {
                          onProgress("1/3 Extracting Bundled Debian Rootfs from APK (Offline)...")
                          val assetList = context.assets.list("") ?: emptyArray()
                          val rootfsAsset = assetList.firstOrNull { it.startsWith("debian-rootfs.tar") }
                              ?: throw IOException("Pre-bundled debian-rootfs asset not found!")
                          context.assets.open(rootfsAsset).use { input ->
                              extractTarFromStream(input, prootManager.rootfsDir, onProgress)
                          }
                      } else {
                          onProgress("1/3 Debian Rootfs already installed.")
                      }

                      val vscodeDir = File(prootManager.rootfsDir, "opt/vscode-arm64")
                      if (!File(vscodeDir, "bin/code").exists()) {
                          vscodeDir.mkdirs()
                          onProgress("2/3 Extracting Bundled Microsoft VS Code from APK (Offline)...")
                          val assetList = context.assets.list("") ?: emptyArray()
                          val vscodeAsset = assetList.firstOrNull { it.startsWith("vscode-linux-arm64") }
                              ?: throw IOException("Pre-bundled vscode-linux-arm64 asset not found!")
                          context.assets.open(vscodeAsset).use { input ->
                              extractTarFromStream(input, vscodeDir, onProgress)
                          }
                      } else {
                          onProgress("2/3 Official VS Code already installed.")
                      }

                      onProgress("3/3 Configuring Environment...")
                      val p = prootManager.startProotCommand("bash /root/init-rootfs.sh", prootManager.homeDir.absolutePath, onLogLine = onProgress)
                      val exit = p.waitFor()
                      onProgress("Provisioning finished with code $exit")
                      exit == 0
                  } catch (e: Exception) {
                      onProgress("ERROR during provisioning: ${e.message}")
                      false
                  }
              }

              fun exportAssetScripts() {
                  val targetDir = File(prootManager.rootfsDir, "root").apply { mkdirs() }
                  listOf("init-rootfs.sh", "start-vscode-session.sh", "verify-vscode.sh").forEach { name ->
                      try {
                          val outFile = File(targetDir, name)
                          context.assets.open(name).use { input -> FileOutputStream(outFile).use { output -> input.copyTo(output) } }
                          outFile.setExecutable(true, false)
                      } catch (_: Exception) {}
                  }
              }

              private fun extractTarFromStream(inputStream: InputStream, destDir: File, onProgress: (String) -> Unit) {
                  val bufferedIn = BufferedInputStream(inputStream, 128 * 1024)
                  val pushback = PushbackInputStream(bufferedIn, 512)
                  val header = ByteArray(6)
                  val n = pushback.read(header)
                  if (n > 0) pushback.unread(header, 0, n)

                  val isGz = n >= 2 && (header[0] == 0x1F.toByte()) && (header[1] == 0x8B.toByte())
                  val isXz = n >= 6 && (header[0] == 0xFD.toByte()) && (header[1] == '7'.code.toByte()) &&
                          (header[2] == 'z'.code.toByte()) && (header[3] == 'X'.code.toByte()) &&
                          (header[4] == 'Z'.code.toByte()) && (header[5] == 0x00.toByte())

                  val compStream: InputStream = when {
                      isXz -> XZCompressorInputStream(pushback)
                      isGz -> GzipCompressorInputStream(pushback)
                      else -> pushback
                  }

                  TarArchiveInputStream(compStream).use { tar ->
                      val standardDirs = setOf("bin", "sbin", "etc", "usr", "lib", "var", "dev", "proc", "sys", "root", "home", "tmp", "opt")
                      var entry = tar.nextTarEntry
                      var count = 0
                      while (entry != null) {
                          val cleanName = entry.name.trimStart('.', '/')
                          if (cleanName.isNotEmpty()) {
                              val parts = cleanName.split("/").filter { it.isNotEmpty() }
                              val finalRelPath = if (parts.size > 1 && !standardDirs.contains(parts[0])) parts.drop(1).joinToString("/") else parts.joinToString("/")
                              if (finalRelPath.isNotEmpty()) {
                                  val outFile = File(destDir, finalRelPath)
                                  if (entry.isDirectory) {
                                      outFile.mkdirs()
                                  } else if (entry.isSymbolicLink) {
                                      outFile.parentFile?.mkdirs()
                                      outFile.delete()
                                      try { Files.createSymbolicLink(outFile.toPath(), Paths.get(entry.linkName)) } catch (_: Exception) {}
                                  } else {
                                      outFile.parentFile?.mkdirs()
                                      FileOutputStream(outFile).use { out -> tar.copyTo(out) }
                                      if ((entry.mode and 0b001_000_000) != 0) {
                                          outFile.setExecutable(true, false)
                                      }
                                  }
                              }
                          }
                          count++
                          if (count % 3000 == 0) onProgress("Extracted $count files...")
                          entry = tar.nextTarEntry
                      }
                  }
              }
          }
          EOF

      - name: Fetch and Patch ARM64 Binaries
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y patchelf
          mkdir -p /tmp/debs
          cd /tmp/debs
          PACKAGES_URL="https://packages.termux.dev/apt/termux-main/dists/stable/main/binary-aarch64/Packages"
          curl -sL "$PACKAGES_URL" -o Packages
          PROOT_DEB_PATH=$(awk '/^Package: proot$/,/^$/' Packages | grep '^Filename:' | head -n 1 | awk '{print $2}')
          TALLOC_DEB_PATH=$(awk '/^Package: libtalloc$/,/^$/' Packages | grep '^Filename:' | head -n 1 | awk '{print $2}')
          SHMEM_DEB_PATH=$(awk '/^Package: libandroid-shmem$/,/^$/' Packages | grep '^Filename:' | head -n 1 | awk '{print $2}')
          if [ -z "$SHMEM_DEB_PATH" ]; then
            SHMEM_DEB_PATH=$(grep -E 'libandroid-shmem.*_aarch64\.deb' Packages | head -n 1 | awk '{print $2}')
          fi
          curl -sL "https://packages.termux.dev/apt/termux-main/$PROOT_DEB_PATH" -o proot.deb
          curl -sL "https://packages.termux.dev/apt/termux-main/$TALLOC_DEB_PATH" -o talloc.deb
          curl -sL "https://packages.termux.dev/apt/termux-main/$SHMEM_DEB_PATH" -o shmem.deb
          mkdir -p extract
          for f in proot.deb talloc.deb shmem.deb; do
            mkdir -p "extract/$f"
            cd "extract/$f"
            ar x "/tmp/debs/$f"
            tar -xf data.tar.*
            cd /tmp/debs
          done
          DEST="$GITHUB_WORKSPACE/app/src/main/jniLibs/arm64-v8a"
          mkdir -p "$DEST"
          TALLOC_SRC=$(find extract -name "libtalloc.so*" | head -n 1)
          cp "$TALLOC_SRC" "$DEST/libtalloc.so"
          patchelf --set-soname libtalloc.so "$DEST/libtalloc.so"
          patchelf --set-rpath '$ORIGIN' "$DEST/libtalloc.so" || true
          SHMEM_SRC=$(find extract -name "libandroid-shmem.so*" | head -n 1)
          cp "$SHMEM_SRC" "$DEST/libandroid-shmem.so"
          patchelf --set-soname libandroid-shmem.so "$DEST/libandroid-shmem.so"
          patchelf --set-rpath '$ORIGIN' "$DEST/libandroid-shmem.so" || true
          PROOT_SRC=$(find extract -path "*/usr/bin/proot" | head -n 1)
          cp "$PROOT_SRC" "$DEST/libproot.so"
          patchelf --replace-needed libtalloc.so.2 libtalloc.so "$DEST/libproot.so" || true
          patchelf --set-rpath '$ORIGIN' "$DEST/libproot.so"
          LOADER_SRC=$(find extract -path "*/libexec/proot/loader" | head -n 1)
          cp "$LOADER_SRC" "$DEST/libproot-loader.so"
          chmod 755 "$DEST/"*.so*

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Assemble Standalone APK
        run: |
          gradle wrapper --gradle-version 8.7
          ./gradlew assembleDebug --stacktrace
          cp app/build/outputs/apk/debug/app-debug.apk PocketVSCode-arm64.apk

      - name: Publish Direct APK & Keystore to GitHub Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RELEASE_TAG="v1.0.${{ github.run_number }}"
          gh release create "$RELEASE_TAG" PocketVSCode-arm64.apk pocket-vscode-permanent.keystore \
            --target "${{ github.sha }}" \
            --title "Pocket VS Code ($RELEASE_TAG)" \
            --notes "Added Mode 2 Auto-Save, Session State Persistence, and Idle Battery Hibernation."

      - name: Upload Artifact Backup
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Pocket-VS-Code-arm64-v8a-APK
          path: PocketVSCode-arm64.apk
