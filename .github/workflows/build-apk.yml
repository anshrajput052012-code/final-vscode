package com.vscode.desktop.standalone

import android.annotation.SuppressLint
import android.content.ActivityNotFoundException
import android.content.Intent
import android.net.Uri
import android.os.Build
import android.os.Bundle
import android.os.Environment
import android.provider.DocumentsContract
import android.provider.Settings
import android.view.View
import android.view.ViewGroup
import android.webkit.WebChromeClient
import android.webkit.WebResourceError
import android.webkit.WebResourceRequest
import android.webkit.WebView
import android.webkit.WebViewClient
import android.widget.Button
import android.widget.EditText
import android.widget.HorizontalScrollView
import android.widget.LinearLayout
import android.widget.ProgressBar
import android.widget.RadioButton
import android.widget.RadioGroup
import android.widget.ScrollView
import android.widget.TextView
import androidx.activity.result.contract.ActivityResultContracts
import androidx.appcompat.app.AppCompatActivity
import androidx.core.content.ContextCompat
import java.io.File
import java.net.InetSocketAddress
import java.net.Socket
import java.util.concurrent.atomic.AtomicBoolean

class MainActivity : AppCompatActivity() {
    private lateinit var prootManager: ProotProcessManager
    private lateinit var provisioner: StandaloneProvisioner
    private lateinit var setupContainer: ScrollView
    private lateinit var workbenchContainer: LinearLayout
    private lateinit var workbenchSurface: WebView
    private lateinit var logView: TextView
    private lateinit var workspaceInput: EditText
    private lateinit var modeGroup: RadioGroup
    private lateinit var setupProgress: ProgressBar
    private lateinit var progressLabel: TextView
    private lateinit var installButton: Button
    private lateinit var verifyButton: Button
    private lateinit var launchButton: Button

    private var activeLinuxProcess: Process? = null
    private val provisioning = AtomicBoolean(false)
    private var browserFallbackAttempted = false

    private val folderPicker =
        registerForActivityResult(ActivityResultContracts.OpenDocumentTree()) { uri: Uri? ->
            uri?.let { selectedUri ->
                try {
                    contentResolver.takePersistableUriPermission(
                        selectedUri,
                        Intent.FLAG_GRANT_READ_URI_PERMISSION or
                            Intent.FLAG_GRANT_WRITE_URI_PERMISSION
                    )
                } catch (_: SecurityException) {}

                val path = resolveUriToPath(selectedUri)
                workspaceInput.setText(path)
                appendLog("Selected Android project folder: $path")

                if (path.isBlank()) {
                    appendLog("Select a folder under Internal storage (Primary).")
                    return@let
                }

                if (!File(path).exists() && !File(path).mkdirs()) {
                    appendLog("Cannot access selected folder.")
                    return@let
                }

                startStandaloneProvisioning()
            }
        }

    override fun onCreate(savedInstanceState: Bundle?) {
        super.onCreate(savedInstanceState)

        prootManager = ProotProcessManager(this)
        provisioner = StandaloneProvisioner(this, prootManager)

        buildSelfContainedUi()
        checkInitialState()
    }

    @SuppressLint("SetJavaScriptEnabled")
    private fun buildSelfContainedUi() {
        val root = LinearLayout(this).apply {
            orientation = LinearLayout.VERTICAL
            layoutParams = ViewGroup.LayoutParams(
                ViewGroup.LayoutParams.MATCH_PARENT,
                ViewGroup.LayoutParams.MATCH_PARENT
            )
        }

        setupContainer = ScrollView(this).apply {
            layoutParams = LinearLayout.LayoutParams(
                LinearLayout.LayoutParams.MATCH_PARENT,
                LinearLayout.LayoutParams.MATCH_PARENT
            )
        }

        val panel = LinearLayout(this).apply {
            orientation = LinearLayout.VERTICAL
            setPadding(36, 36, 36, 36)
        }

        panel.addView(TextView(this).apply {
            text = "Pocket VS Code"
            textSize = 25f
        })

        panel.addView(TextView(this).apply {
            text = "Standalone Linux + genuine Microsoft VS Code · ARM64"
            textSize = 13f
        })

        modeGroup = RadioGroup(this).apply {
            orientation = RadioGroup.VERTICAL

            addView(RadioButton(this@MainActivity).apply {
                id = MODE_X11
                text = "Mode 1: Full Electron Desktop (X11 / noVNC)"
                isChecked = true
            })

            addView(RadioButton(this@MainActivity).apply {
                id = MODE_WEB
                text = "Mode 2: Native VS Code Web Workbench (8080)"
            })
        }

        panel.addView(modeGroup)

        panel.addView(TextView(this).apply {
            text = "Project folder (mounted inside Linux at /root/Workspace)"
        })

        workspaceInput = EditText(this).apply {
            setText(
                File(
                    Environment.getExternalStorageDirectory(),
                    "VSCodeProjects"
                ).absolutePath
            )
            singleLine = true
        }

        panel.addView(workspaceInput)

        panel.addView(Button(this).apply {
            text = "1. Select Android Project Folder · Auto Setup"

            setOnClickListener {
                if (
                    Build.VERSION.SDK_INT >= Build.VERSION_CODES.R &&
                    !Environment.isExternalStorageManager()
                ) {
                    appendLog(
                        "Enable All files access, then tap Select Folder again."
                    )

                    try {
                        startActivity(
                            Intent(
                                Settings.ACTION_MANAGE_APP_ALL_FILES_ACCESS_PERMISSION,
                                Uri.parse("package:$packageName")
                            )
                        )
                    } catch (_: Exception) {
                        startActivity(
                            Intent(Settings.ACTION_MANAGE_ALL_FILES_ACCESS_PERMISSION)
                        )
                    }
                } else {
                    folderPicker.launch(null)
                }
            }
        })

        installButton = Button(this).apply {
            text = "Retry / Install bundled Linux + VS Code"
            setOnClickListener {
                startStandaloneProvisioning()
            }
        }

        panel.addView(installButton)

        setupProgress = ProgressBar(
            this,
            null,
            android.R.attr.progressBarStyleHorizontal
        ).apply {
            max = 100
            progress = 0
        }

        panel.addView(
            setupProgress,
            LinearLayout.LayoutParams(
                ViewGroup.LayoutParams.MATCH_PARENT,
                ViewGroup.LayoutParams.WRAP_CONTENT
            )
        )

        progressLabel = TextView(this).apply {
            text = "0% · Select a project folder to begin automatic setup."
            textSize = 13f
        }

        panel.addView(progressLabel)

        verifyButton = Button(this).apply {
            text = "2. Verify VS Code, Terminal, Git & Extensions"
            isEnabled = false
            setOnClickListener {
                runStandaloneVerification()
            }
        }

        panel.addView(verifyButton)

        launchButton = Button(this).apply {
            text = "3. Launch Pocket VS Code"
            isEnabled = false
            setOnClickListener {
                launchEmbeddedVSCode()
            }
        }

        panel.addView(launchButton)

        logView = TextView(this).apply {
            textSize = 12f
            setPadding(18, 18, 18, 18)
            setBackgroundColor(0xFF141414.toInt())
            setTextColor(0xFF00E676.toInt())
            text = "Ready. Select a project folder."
        }

        panel.addView(logView)
        setupContainer.addView(panel)

        workbenchContainer = LinearLayout(this).apply {
            orientation = LinearLayout.VERTICAL
            visibility = View.GONE
            layoutParams = LinearLayout.LayoutParams(
                ViewGroup.LayoutParams.MATCH_PARENT,
                ViewGroup.LayoutParams.MATCH_PARENT
            )
        }

        val keyBarScroll = HorizontalScrollView(this).apply {
            setBackgroundColor(0xFF252526.toInt())
        }

        val keyBar = LinearLayout(this).apply {
            orientation = LinearLayout.HORIZONTAL
            setPadding(8, 4, 8, 4)
        }

        listOf(
            "ESC" to "Escape",
            "TAB" to "Tab",
            "F1" to "F1",
            "Quick Open" to "Control+P",
            "Terminal" to "Control+Backquote",
            "Save" to "Control+S",
            "Find" to "Control+F",
            "Setup / Logs" to "PANEL"
        ).forEach { (label, action) ->
            keyBar.addView(Button(this).apply {
                text = label
                textSize = 11f

                setOnClickListener {
                    if (action == "PANEL") {
                        showSetupPanel()
                    } else {
                        injectKeyIntoWorkbench(action)
                    }
                }
            })
        }

        keyBarScroll.addView(keyBar)
        workbenchContainer.addView(keyBarScroll)

        workbenchSurface = WebView(this).apply {
            layoutParams = LinearLayout.LayoutParams(
                ViewGroup.LayoutParams.MATCH_PARENT,
                0,
                1f
            )

            settings.javaScriptEnabled = true
            settings.domStorageEnabled = true
            settings.databaseEnabled = true
            settings.allowFileAccess = true
            settings.useWideViewPort = true
            settings.loadWithOverviewMode = true
            settings.setSupportZoom(true)

            webChromeClient = WebChromeClient()

            webViewClient = object : WebViewClient() {
                override fun shouldOverrideUrlLoading(
                    view: WebView?,
                    request: WebResourceRequest?
                ): Boolean = false

                @Deprecated("Deprecated in Java")
                override fun shouldOverrideUrlLoading(
                    view: WebView?,
                    url: String?
                ): Boolean = false

                override fun onReceivedError(
                    view: WebView?,
                    request: WebResourceRequest?,
                    error: WebResourceError?
                ) {
                    super.onReceivedError(view, request, error)

                    if (
                        request?.isForMainFrame == true &&
                        !browserFallbackAttempted
                    ) {
                        browserFallbackAttempted = true

                        runOnUiThread {
                            openInExternalBrowser(
                                "WebView failed: ${error?.description ?: "unknown error"}"
                            )
                        }
                    }
                }
            }
        }

        workbenchContainer.addView(workbenchSurface)

        root.addView(setupContainer)
        root.addView(workbenchContainer)

        setContentView(root)
    }

    private fun checkInitialState() {
        appendLog("Native binaries: ${prootManager.prootBinary.exists()}")

        if (prootManager.isRootfsProvisioned()) {
            updateProgress(
                100,
                "Linux and VS Code are already installed. Ready to launch."
            )
            setSetupReady(true)
        } else {
            appendLog(
                "Bundled Debian + VS Code will be extracted after folder selection."
            )
        }
    }

    private fun startStandaloneProvisioning() {
        if (!provisioning.compareAndSet(false, true)) return

        val workspace = workspaceInput.text.toString().trim()

        if (workspace.isBlank()) {
            provisioning.set(false)
            appendLog("Choose a project folder first.")
            return
        }

        setSetupReady(false)
        updateProgress(0, "Starting offline setup in background…")

        Thread {
            val ok = provisioner.provisionAll { percent, message ->
                runOnUiThread {
                    updateProgress(percent, message)
                }
            }

            runOnUiThread {
                provisioning.set(false)

                if (ok) {
                    updateProgress(
                        100,
                        "100% · Setup complete. You can launch VS Code now."
                    )
                    setSetupReady(true)
                    appendLog("SUCCESS: Pocket VS Code is ready.")
                } else {
                    setSetupReady(false)
                    appendLog("Setup failed. Check the error above and tap Retry.")
                }
            }
        }.start()
    }

    private fun setSetupReady(ready: Boolean) {
        launchButton.isEnabled = ready
        verifyButton.isEnabled = ready
        installButton.isEnabled = !provisioning.get()
    }

    private fun updateProgress(percent: Int, message: String) {
        val safe = percent.coerceIn(0, 100)
        setupProgress.progress = safe
        progressLabel.text = "$safe% · $message"

        if (safe == 100) {
            setSetupReady(true)
        }
    }

    private fun runStandaloneVerification() {
        Thread {
            appendLog("Running embedded Debian verification…")

            val process = prootManager.startProotCommand(
                command = "bash /root/verify-vscode.sh",
                workspaceHostPath = workspaceInput.text.toString(),
                onLogLine = ::appendLog
            )

            val exit = process.waitFor()
            appendLog("Verification finished with exit code $exit")
        }.start()
    }

    private fun launchEmbeddedVSCode() {
        if (!prootManager.isRootfsProvisioned()) {
            appendLog(
                "Linux is not installed yet. Select a folder to run setup."
            )
            return
        }

        ContextCompat.startForegroundService(
            this,
            Intent(this, LinuxRuntimeService::class.java)
        )

        val webMode = modeGroup.checkedRadioButtonId == MODE_WEB
        val mode = if (webMode) "direct" else "x11"

        val targetUrl = if (webMode) {
            MODE2_URL
        } else {
            "http://127.0.0.1:6080/vnc.html?autoconnect=true&resize=remote"
        }

        appendLog("Starting VS Code in $mode mode…")

        activeLinuxProcess?.destroy()
        browserFallbackAttempted = false

        activeLinuxProcess = try {
            prootManager.startProotCommand(
                command = "bash /root/start-vscode-session.sh $mode",
                workspaceHostPath = workspaceInput.text.toString(),
                displayMode = mode,
                onLogLine = { line ->
                    appendLog(line)

                    if (
                        !webMode &&
                        line.contains("VSCODE_DISPLAY_READY")
                    ) {
                        runOnUiThread {
                            showWorkbench(targetUrl)
                        }
                    }
                }
            )
        } catch (e: Exception) {
            stopService(Intent(this, LinuxRuntimeService::class.java))
            appendLog("Could not start Linux process: ${e.message}")
            return
        }

        val monitoredProcess = activeLinuxProcess

        if (monitoredProcess != null) {
            Thread {
                val exitCode = try {
                    monitoredProcess.waitFor()
                } catch (_: InterruptedException) {
                    -1
                }

                runOnUiThread {
                    if (activeLinuxProcess === monitoredProcess) {
                        activeLinuxProcess = null
                        stopService(
                            Intent(this, LinuxRuntimeService::class.java)
                        )
                        appendLog(
                            "Linux session ended (exit $exitCode). Background wake lock released."
                        )
                    }
                }
            }.start()
        }

        if (webMode) {
            Thread {
                val ready = waitForLocalServer(90_000)

                runOnUiThread {
                    if (ready) {
                        showWorkbench(targetUrl)
                    } else {
                        appendLog(
                            "Mode 2 did not become ready on port 8080 within 90 seconds."
                        )
                    }
                }
            }.start()
        }
    }

    private fun waitForLocalServer(timeoutMs: Long): Boolean {
        val deadline = System.currentTimeMillis() + timeoutMs

        while (System.currentTimeMillis() < deadline) {
            try {
                Socket().use {
                    it.connect(
                        InetSocketAddress("127.0.0.1", 8080),
                        700
                    )
                }
                return true
            } catch (_: Exception) {
                Thread.sleep(500)
            }
        }

        return false
    }

    private fun showWorkbench(url: String) {
        setupContainer.visibility = View.GONE
        workbenchContainer.visibility = View.VISIBLE
        workbenchSurface.loadUrl(url)
    }

    private fun showSetupPanel() {
        if (::workbenchSurface.isInitialized) {
            workbenchSurface.loadUrl("about:blank")
        }

        workbenchContainer.visibility = View.GONE
        setupContainer.visibility = View.VISIBLE
    }

    private fun openInExternalBrowser(reason: String) {
        appendLog("$reason. Trying external browser…")

        try {
            startActivity(
                Intent(Intent.ACTION_VIEW, Uri.parse(MODE2_URL))
            )
        } catch (_: ActivityNotFoundException) {
            appendLog("No browser app can open $MODE2_URL")
        }
    }

    private fun injectKeyIntoWorkbench(key: String) {
        val safe = key.replace("'", "")

        workbenchSurface.evaluateJavascript(
            "window.dispatchEvent(new KeyboardEvent('keydown',{key:'$safe',bubbles:true}));",
            null
        )
    }

    private fun resolveUriToPath(treeUri: Uri): String {
        return try {
            if (
                treeUri.authority !=
                "com.android.externalstorage.documents"
            ) {
                throw IllegalArgumentException("Unsupported folder provider")
            }

            val docId = DocumentsContract.getTreeDocumentId(treeUri)
            val parts = docId.split(":", limit = 2)

            if (
                parts.size != 2 ||
                !parts[0].equals("primary", ignoreCase = true)
            ) {
                throw IllegalArgumentException(
                    "Select a folder under Internal storage / Primary"
                )
            }

            File(
                Environment.getExternalStorageDirectory(),
                parts[1]
            ).absolutePath

        } catch (e: Exception) {
            appendLog("Folder selection note: ${e.message}")
            ""
        }
    }

    private fun appendLog(message: String) {
        runOnUiThread {
            if (::logView.isInitialized) {
                logView.append("\n$message")
            }
        }
    }

    override fun onBackPressed() {
        if (
            ::workbenchContainer.isInitialized &&
            workbenchContainer.visibility == View.VISIBLE
        ) {
            showSetupPanel()
        } else {
            super.onBackPressed()
        }
    }

    companion object {
        private const val MODE_X11 = 1001
        private const val MODE_WEB = 1002
        private const val MODE2_URL =
            "http://127.0.0.1:8080/?folder=/root/Workspace"
    }
}
