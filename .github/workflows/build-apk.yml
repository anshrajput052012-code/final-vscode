name: Build Standalone VS Code Android APK (Zero Termux)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-arm64-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Project Source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Auto-Fix Folder Structure & Generate Root Configs
        run: |
          for f in app__*; do
            if [ -f "$f" ]; then
              target=$(echo "$f" | sed 's/__/\//g')
              mkdir -p "$(dirname "$target")"
              mv "$f" "$target"
            fi
          done

          cat > settings.gradle.kts << 'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "VSCodeAndroidStandalone"
          include(":app")
          EOF

          cat > build.gradle.kts << 'EOF'
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          EOF

          cat > gradle.properties << 'EOF'
          org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          kotlin.code.style=official
          android.nonTransitiveRClass=true
          EOF

      - name: Fetch and Bundle Genuine Debian Rootfs into APK Assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p app/src/main/assets
          python3 - << 'EOF'
          import urllib.request, json, subprocess, os, sys

          urls = []
          try:
              res = subprocess.run(["gh", "api", "repos/termux/proot-distro/releases?per_page=100"], capture_output=True, text=True)
              releases = json.loads(res.stdout)
              for rel in releases:
                  for asset in rel.get("assets", []):
                      name = asset.get("name", "")
                      if "debian" in name and "aarch64" in name and ("tar.xz" in name or "tar.gz" in name):
                          urls.append(asset.get("browser_download_url"))
          except Exception as e:
              print("GH API Note:", e)

          urls.append("https://raw.githubusercontent.com/debuerreotype/docker-debian-artifacts/dist-arm64v8/bookworm/rootfs.tar.xz")
          urls.append("http://cdimage.ubuntu.com/ubuntu-base/releases/22.04/release/ubuntu-base-22.04-base-arm64.tar.gz")

          downloaded = False
          for url in urls:
              print(f"Downloading Rootfs from: {url}")
              try:
                  req = urllib.request.Request(url, headers={"User-Agent": "Mozilla/5.0"})
                  with urllib.request.urlopen(req, timeout=60) as resp:
                      if resp.status in (200, 302):
                          ext = ".xz" if "xz" in url else ".gz"
                          dest = f"app/src/main/assets/debian-rootfs.tar{ext}"
                          with open(dest, "wb") as f:
                              while True:
                                  chunk = resp.read(1024 * 1024)
                                  if not chunk: break
                                  f.write(chunk)
                          if os.path.getsize(dest) > 10 * 1024 * 1024:
                              print(f"Successfully bundled rootfs: {dest}")
                              downloaded = True
                              break
              except Exception as e:
                  print(f"Skipping failed mirror: {e}")

          if not downloaded:
              print("Failed to download rootfs during build")
              sys.exit(1)
          EOF
          ls -lh app/src/main/assets/

      - name: Configure StandaloneProvisioner with Embedded Rootfs and Auto-Resume
        run: |
          STANDALONE_PROV="app/src/main/java/com/vscode/desktop/standalone/StandaloneProvisioner.kt"
          mkdir -p "$(dirname "$STANDALONE_PROV")"
          cat > "$STANDALONE_PROV" << 'EOF'
          package com.vscode.desktop.standalone

          import android.content.Context
          import org.apache.commons.compress.archivers.tar.TarArchiveInputStream
          import org.apache.commons.compress.compressors.gzip.GzipCompressorInputStream
          import org.apache.commons.compress.compressors.xz.XZCompressorInputStream
          import java.io.*
          import java.net.HttpURLConnection
          import java.net.URL
          import java.nio.file.Files
          import java.nio.file.Paths

          class StandaloneProvisioner(private val context: Context, private val prootManager: ProotProcessManager) {
              companion object {
                  const val VSCODE_ARM64_URL = "https://update.code.visualstudio.com/latest/linux-arm64/stable"
              }

              fun provisionAll(onProgress: (String) -> Unit): Boolean {
                  return try {
                      exportAssetScripts()
                      if (!File(prootManager.rootfsDir, "bin/bash").exists()) {
                          onProgress("1/4 Extracting Embedded ARM64 Debian Rootfs from APK...")
                          val assetList = context.assets.list("") ?: emptyArray()
                          val rootfsAsset = assetList.firstOrNull { it.startsWith("debian-rootfs.tar") }
                          if (rootfsAsset != null) {
                              val rootfsTar = File(prootManager.tmpDir, rootfsAsset)
                              context.assets.open(rootfsAsset).use { input ->
                                  FileOutputStream(rootfsTar).use { output -> input.copyTo(output) }
                              }
                              extractTarArchive(rootfsTar, prootManager.rootfsDir)
                              rootfsTar.delete()
                          } else {
                              throw IOException("Embedded Debian rootfs not found in APK assets!")
                          }
                      } else {
                          onProgress("1/4 Debian Rootfs already installed.")
                      }

                      val vscodeDir = File(prootManager.rootfsDir, "opt/vscode-arm64")
                      if (!File(vscodeDir, "bin/code").exists()) {
                          vscodeDir.mkdirs()
                          val vscodeTar = File(prootManager.tmpDir, "vscode-linux-arm64.tar.gz")
                          onProgress("2/4 Downloading Official Microsoft VS Code...")
                          downloadWithResume(VSCODE_ARM64_URL, vscodeTar, onProgress)
                          onProgress("3/4 Extracting Genuine VS Code...")
                          extractTarArchive(vscodeTar, vscodeDir)
                          vscodeTar.delete()
                      } else {
                          onProgress("2/4 Official VS Code already installed.")
                      }

                      onProgress("4/4 Configuring Environment...")
                      val p = prootManager.startProotCommand("bash /root/init-rootfs.sh", prootManager.homeDir.absolutePath, onLogLine = onProgress)
                      val exit = p.waitFor()
                      onProgress("Provisioning finished with code $exit")
                      exit == 0
                  } catch (e: Exception) {
                      onProgress("ERROR during provisioning: ${e.message}")
                      false
                  }
              }

              private fun exportAssetScripts() {
                  val targetDir = File(prootManager.rootfsDir, "root").apply { mkdirs() }
                  listOf("init-rootfs.sh", "start-vscode-session.sh", "verify-vscode.sh").forEach { name ->
                      try {
                          val outFile = File(targetDir, name)
                          context.assets.open(name).use { input -> FileOutputStream(outFile).use { output -> input.copyTo(output) } }
                          outFile.setExecutable(true, false)
                      } catch (_: Exception) {}
                  }
              }

              private fun downloadWithResume(urlStr: String, destination: File, onProgress: (String) -> Unit) {
                  var currentUrl = urlStr
                  var redirects = 0
                  while (redirects < 10) {
                      val conn = URL(currentUrl).openConnection() as HttpURLConnection
                      conn.instanceFollowRedirects = false
                      conn.setRequestProperty("User-Agent", "Mozilla/5.0")
                      conn.connectTimeout = 30000
                      conn.readTimeout = 30000
                      val code = conn.responseCode
                      if (code in listOf(301, 302, 303, 307, 308)) {
                          val loc = conn.getHeaderField("Location")
                          if (loc != null) {
                              currentUrl = if (loc.startsWith("http")) loc else URL(URL(currentUrl), loc).toString()
                              redirects++
                              continue
                          }
                      }
                      break
                  }

                  val existingBytes = if (destination.exists()) destination.length() else 0L
                  val conn = URL(currentUrl).openConnection() as HttpURLConnection
                  conn.setRequestProperty("User-Agent", "Mozilla/5.0")
                  conn.connectTimeout = 30000
                  conn.readTimeout = 30000

                  var isResume = false
                  if (existingBytes > 0) {
                      conn.setRequestProperty("Range", "bytes=$existingBytes-")
                  }

                  val code = conn.responseCode
                  if (code == 206) {
                      isResume = true
                  } else if (code == 200) {
                      isResume = false
                  } else if (code == 416) {
                      return
                  } else {
                      throw IOException("HTTP $code on $currentUrl")
                  }

                  val totalLength = if (isResume) existingBytes + conn.contentLengthLong else conn.contentLengthLong
                  val append = isResume
                  var downloaded = if (isResume) existingBytes else 0L

                  BufferedInputStream(conn.inputStream).use { input ->
                      FileOutputStream(destination, append).use { output ->
                          val buffer = ByteArray(64 * 1024)
                          var read: Int
                          var lastMb = -1L
                          while (input.read(buffer).also { read = it } != -1) {
                              output.write(buffer, 0, read)
                              downloaded += read
                              val mb = downloaded / (1024 * 1024)
                              if (mb != lastMb && mb % 5L == 0L) {
                                  lastMb = mb
                                  val totalMb = if (totalLength > 0) "${totalLength / (1024 * 1024)} MB" else "..."
                                  onProgress("Downloaded $mb MB / $totalMb...")
                              }
                          }
                      }
                  }
              }

              private fun isXzArchive(file: File): Boolean {
                  return try {
                      FileInputStream(file).use { fis ->
                          val b = ByteArray(6)
                          val r = fis.read(b)
                          r >= 6 && b[0] == 0xFD.toByte() && b[1] == '7'.code.toByte() &&
                                  b[2] == 'z'.code.toByte() && b[3] == 'X'.code.toByte() &&
                                  b[4] == 'Z'.code.toByte() && b[5] == 0x00.toByte()
                      }
                  } catch (_: Exception) {
                      false
                  }
              }

              private fun extractTarArchive(archiveFile: File, destDir: File) {
                  val isXz = archiveFile.name.endsWith(".xz") || isXzArchive(archiveFile)
                  FileInputStream(archiveFile).use { fis ->
                      val compStream = if (isXz) XZCompressorInputStream(BufferedInputStream(fis)) else GzipCompressorInputStream(BufferedInputStream(fis))
                      TarArchiveInputStream(compStream).use { tar ->
                          val standardDirs = setOf("bin", "sbin", "etc", "usr", "lib", "var", "dev", "proc", "sys", "root", "home", "tmp", "opt")
                          var entry = tar.nextTarEntry
                          while (entry != null) {
                              val cleanName = entry.name.trimStart('.', '/')
                              if (cleanName.isNotEmpty()) {
                                  val parts = cleanName.split("/").filter { it.isNotEmpty() }
                                  val finalRelPath = if (parts.size > 1 && !standardDirs.contains(parts[0])) parts.drop(1).joinToString("/") else parts.joinToString("/")
                                  if (finalRelPath.isNotEmpty()) {
                                      val outFile = File(destDir, finalRelPath)
                                      if (entry.isDirectory) {
                                          outFile.mkdirs()
                                      } else if (entry.isSymbolicLink) {
                                          outFile.parentFile?.mkdirs()
                                          outFile.delete()
                                          try { Files.createSymbolicLink(outFile.toPath(), Paths.get(entry.linkName)) } catch (_: Exception) {}
                                      } else {
                                          outFile.parentFile?.mkdirs()
                                          FileOutputStream(outFile).use { out -> tar.copyTo(out) }
                                          if ((entry.mode and 0b001_000_000) != 0) {
                                              outFile.setExecutable(true, false)
                                          }
                                      }
                                  }
                              }
                              entry = tar.nextTarEntry
                          }
                      }
                  }
              }
          }
          EOF

      - name: Fetch and Patch ARM64 Binaries (libproot, libtalloc, libandroid-shmem)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y patchelf

          mkdir -p /tmp/debs
          cd /tmp/debs

          PACKAGES_URL="https://packages.termux.dev/apt/termux-main/dists/stable/main/binary-aarch64/Packages"
          curl -sL "$PACKAGES_URL" -o Packages

          PROOT_DEB_PATH=$(awk '/^Package: proot$/,/^$/' Packages | grep '^Filename:' | head -n 1 | awk '{print $2}')
          TALLOC_DEB_PATH=$(awk '/^Package: libtalloc$/,/^$/' Packages | grep '^Filename:' | head -n 1 | awk '{print $2}')
          SHMEM_DEB_PATH=$(awk '/^Package: libandroid-shmem$/,/^$/' Packages | grep '^Filename:' | head -n 1 | awk '{print $2}')

          if [ -z "$SHMEM_DEB_PATH" ]; then
            SHMEM_DEB_PATH=$(grep -E 'libandroid-shmem.*_aarch64\.deb' Packages | head -n 1 | awk '{print $2}')
          fi

          echo "Fetching: $PROOT_DEB_PATH, $TALLOC_DEB_PATH, $SHMEM_DEB_PATH"

          curl -sL "https://packages.termux.dev/apt/termux-main/$PROOT_DEB_PATH" -o proot.deb
          curl -sL "https://packages.termux.dev/apt/termux-main/$TALLOC_DEB_PATH" -o talloc.deb
          curl -sL "https://packages.termux.dev/apt/termux-main/$SHMEM_DEB_PATH" -o shmem.deb

          mkdir -p extract
          for f in proot.deb talloc.deb shmem.deb; do
            mkdir -p "extract/$f"
            cd "extract/$f"
            ar x "/tmp/debs/$f"
            tar -xf data.tar.*
            cd /tmp/debs
          done

          DEST="$GITHUB_WORKSPACE/app/src/main/jniLibs/arm64-v8a"
          mkdir -p "$DEST"

          # 1. Bundle libtalloc.so
          TALLOC_SRC=$(find extract -name "libtalloc.so*" | head -n 1)
          cp "$TALLOC_SRC" "$DEST/libtalloc.so"
          patchelf --set-soname libtalloc.so "$DEST/libtalloc.so"
          patchelf --set-rpath '$ORIGIN' "$DEST/libtalloc.so" || true

          # 2. Bundle libandroid-shmem.so
          SHMEM_SRC=$(find extract -name "libandroid-shmem.so*" | head -n 1)
          cp "$SHMEM_SRC" "$DEST/libandroid-shmem.so"
          patchelf --set-soname libandroid-shmem.so "$DEST/libandroid-shmem.so"
          patchelf --set-rpath '$ORIGIN' "$DEST/libandroid-shmem.so" || true

          # 3. Bundle libproot.so
          PROOT_SRC=$(find extract -path "*/usr/bin/proot" | head -n 1)
          cp "$PROOT_SRC" "$DEST/libproot.so"
          patchelf --replace-needed libtalloc.so.2 libtalloc.so "$DEST/libproot.so" || true
          patchelf --set-rpath '$ORIGIN' "$DEST/libproot.so"

          # 4. Bundle proot-loader
          LOADER_SRC=$(find extract -path "*/libexec/proot/loader" | head -n 1)
          cp "$LOADER_SRC" "$DEST/libproot-loader.so"

          chmod 755 "$DEST/"*.so*
          ls -la "$DEST"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Assemble Standalone APK
        run: |
          gradle wrapper --gradle-version 8.7
          ./gradlew assembleDebug --stacktrace

      - name: Upload Installable Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: VSCode-Android-Standalone-arm64-v8a-APK
          path: app/build/outputs/apk/debug/app-debug.apk
